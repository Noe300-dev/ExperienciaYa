<!DOCTYPE html>

<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registro de usuarios de ExperienciaYa.">
  <title>ExperienciaYa - Registro</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <header class="header-principal"> 
        <div class="botones-usuario" style="float:right;">
            <a href="usuario.html" class="boton boton-principal">Usuario</a>  
        </div>
        
        <h1 style="float:inline-start;" class="titulo-principal">ExperienciaYa</h1> <br> <br>
        <p style="float: inline-start;" class="subtitulo-principal">Encuentra algo increíble para hacer</p>
    </header>
  <nav class="navbar navbar-expand-lg navbar-principal">
    <div class="container-fluid nav-contenedor">
      <a class="navbar-brand titulo-navbar" href="index.html">ExperienciaYa </a>
      <button class="navbar-toggler boton-menu" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuNavegacion">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="usuario.html">Experiencias</a>
          <a class="nav-link" href="reserva.html">Reservar</a>
          <a class="nav-link" href="contacto.html">Contacto</a>
          <a class="nav-link" href="carrito.html">Carrito</a>
        </div>
      </div>
    </div>
  </nav>
  <main class="contenido-principal">
    <section class="seccion seccion-formulario">
      <h2 class="titulo-seccion">Crear una cuenta </h2>
      <form id="formularioRegistro" class="formulario">
        <div class="grupo-formulario">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
        </div>
        <div class="grupo-formulario">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="grupo-formulario">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678" required>
        </div>
        <div class="grupo-formulario">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>
        <div class="grupo-formulario">
          <label for="confirmarPassword"> Confirmar contraseña</label>
          <input type="password" id="confirmarPassword" name="confirmarPassword" placeholder="Repite tu contraseña" minlength="6" required>
        </div>
        <button class="boton boton-principal" type="submit">Registrarme</button>
      </form>
      <p id="mensajeRegistro" class="mensaje"></p>
    </section>
  </main>
  <footer class="footer-principal">
    <h2>ExperienciaYa</h2>
    <p>Encuentra, reserva y disfruta.</p>
    <div class="footer-enlaces">
      <a href="index.html">Inicio</a>
      <a href="registro.html">Registro</a>
      <a href="usuario.html">Experiencias</a>
      <a href="reserva.html">Reservar</a>
      <a href="contacto.html">Contacto</a>
      <a href="carrito.html">Carrito</a>  
    </div>
    <p> © 2026 ExperienciaYa. Todos los derechos reservados.</p>
  </footer>
  <script src="javascript.js"></script>
</body>
</html>
