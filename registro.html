<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registro de usuarios de ExperienciaYa.">
  <title>ExperienciaYa - Registro</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<!-- BARRA SUPERIOR Y NAVEGACIÓN -->
<div class="barra-superior">
    Compra online y vive experiencias increíbles
</div>

<header class="header-global">
    <nav class="navbar-global">
        <a href="index.html" class="logo-global">ExperienciaYa</a>

        <div class="menu-global">
            <a href="index.html">Inicio</a>
            <a href="experiencias.html">Experiencias</a>
            <a href="reserva.html">Reservar</a>
            <a href="contacto.html">Contacto</a>
            <button id="cerrarSesion" class="btn btn-danger">Cerrar Sesión</button>
        </div>

        <div class="iconos-global">
            <a href="usuario.html" title="Mi Perfil"><i class="bi bi-person-circle"></i></a>
            <a href="registro.html" title="Registrarse"><i class="bi bi-person-add"></i></a>
            <a href="carrito.html" title="Carrito"><i class="bi bi-bag"></i></a>
        </div>
    </nav>
</header>

  <main class="contenido-principal">
<div class="container my-5">
    <div class="row g-4">
        <!-- Columna de Registro -->
        <div class="col-md-6">
            <div class="p-4 border rounded bg-white shadow-sm">
                <h3 class="mb-3">Crear una cuenta</h3>
                <form id="formularioRegistro">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre completo</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" id="correo" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="tel" id="telefono" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
                        <input type="password" id="confirmarPassword" class="form-control" required>
                    </div>
                    <div id="mensajeRegistro" class="mb-3"></div>
                    <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                </form>
            </div>
        </div>

        <!-- Columna de Inicio de Sesión -->
        <div class="col-md-6">
            <div class="p-4 border rounded bg-white shadow-sm">
                <h3 class="mb-3">Iniciar Sesión</h3>
                <form id="formularioLogin">
                    <div class="mb-3">
                        <label for="loginCorreo" class="form-label">Correo electrónico</label>
                        <input type="email" id="loginCorreo" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Contraseña</label>
                        <input type="password" id="loginPassword" class="form-control" required>
                    </div>
                    <div id="mensajeLogin" class="mb-3"></div>
                    <button type="submit" class="btn btn-success w-100">Ingresar a mi cuenta</button>
                </form>
            </div>
        </div>
    </div>
</div>
  </main>
  
  
  <footer class="footer-principal">
    <h2>ExperienciaYa</h2>
    <p>Encuentra, reserva y disfruta.</p>
    <div class="footer-enlaces">

        <a href="experiencias.html">Experiencias</a>
        <a href="reserva.html">Reservar</a>
        <a href="contacto.html">Contacto</a>
    </div>
    <p>© 2026 ExperienciaYa. Todos los derechos reservados.</p>
</footer>

  <script src="js/javascript.js"></script></body>
