<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Administrador - ExperienciaYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            margin: 0;
            overflow-x: hidden;
        }
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }
        /* Menú Vertical */
        .sidebar-admin {
            width: 250px;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand {
            padding: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: #333;
            text-decoration: none;
            transition: background 0.2s;
        }
        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background-color: #e9ecef;
            color: #0d6efd;
            font-weight: 500;
        }
        /* Contenido Central */
        .admin-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .admin-header {
            background-color: #ffffff;
            padding: 15px 30px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-main {
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="admin-layout">
        <!-- Menú Vertical Visible -->
        <aside class="sidebar-admin">
            <div class="sidebar-brand">
                <i class="bi bi-compass"></i> ExperienciaYa
            </div>
            <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="admin.html" class="nav-link link-dark">
                    <i class="bi bi-grid-1x2 me-2"></i> Home
                </a>
            </li>
            <li>
                <a href="mantenedor-productos.html" class="nav-link link-dark">
                    <i class="bi bi-box-seam me-2"></i> Productos
                </a>
            </li>
            <li>
                <a href="mantenedor-usuarios.html" class="nav-link link-dark">
                    <i class="bi bi-people me-2"></i> Usuarios
                </a>
            </li>
            <!-- CORREGIDO: etiqueta <li> completa -->
            <li>
                <a href="mantenedor-blog.html" class="nav-link link-dark">
                    <i class="bi bi-journal-text me-2"></i> Blog
                </a>
            </li>
            <li>
                <a href="reportes.html" class="nav-link link-dark">
                    <i class="bi bi-file-earmark-text me-2"></i> Reportes
                </a>
            </li>
        </ul>
        </aside>

        <!-- Contenido al Centro -->
        <div class="admin-content">
            <header class="admin-header">
                <h2>¡HOLA Administrador!</h2>
                <div class="header-actions">
                    <i class="bi bi-bell fs-5"></i>
                </div>
            </header>

            <main class="admin-main">
                <!-- El espacio en blanco representa el área central para futuros contenidos según el mockup -->
                <p class="text-muted">Selecciona una opción del menú lateral para gestionar los mantenedores del sistema.</p>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
