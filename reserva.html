</head>
<body>
<!-- BARRA SUPERIOR Y NAVEGACIÓN -->
<div class="barra-superior">
    Compra online y vive experiencias increíbles
</div>

<header class="header-global">
    <nav class="navbar-global">
        <a href="index.html" class="logo-global">ExperienciaYa</a>

        <div class="menu-global">
            <a href="index.html">Inicio</a>
            <a href="experiencias.html">Experiencias</a>
            <a href="contacto.html">Contacto</a>
        </div>

        <div class="iconos-global">
            <a href="usuario.html" title="Mi Perfil"><i class="bi bi-person-circle"></i></a>
            <a href="registro.html" title="Registrarse"><i class="bi bi-person-add"></i></a>
            <a href="carrito.html" title="Carrito"><i class="bi bi-bag"></i></a>
            <button id="cerrarSesion" class="btn btn-danger">Cerrar Sesión</button>
        </div>
    </nav>
</header>


<!-- main -->
<main class="contenido-principal">
    <section class="seccion seccion-formulario">
        <h2 class="titulo-seccion">Reservar experiencia</h2>
        <form id="formularioReserva" class="tarjeta-formulario">
    <h2>Reservar experiencia</h2>
    
    <!-- Selector de Experiencia -->
    <div class="mb-3">
        <label for="experiencia" class="form-label">Experiencia</label>
        <select id="experiencia" class="form-select" required>
            <option value="Kayak en Santiago">Kayak en Santiago</option>
            <option value="Taller de ceramica">Taller de ceramica</option>
            <option value="Clase de cocina">Clase de cocina</option>
            <option value="Experiencia de trekking">Experiencia de trekking</option>
            <option value="Vuelo en Globo">Vuelo en Globo</option>
        </select>
    </div>

    <!-- Selector dinámico de Fecha -->
    <div class="mb-3">
        <label for="fecha" class="form-label">Fecha</label>
        <select id="fecha" class="form-select" required>
            <!-- Se llena automáticamente con JS según la experiencia -->
        </select>
    </div>

    <!-- Selector dinámico de Hora -->
    <div class="mb-3">
        <label for="hora" class="form-label">Hora</label>
        <select id="hora" class="form-select" required>
            <!-- Se llena automáticamente con JS según la experiencia -->
        </select>
    </div>

    <!-- Input de Personas con min y max dinámico -->
    <div class="mb-3">
        <label for="personas" class="form-label">Cantidad de personas</label>
        <input type="number" id="personas" class="form-control" min="1" max="10" value="1" required>
        <small id="infoPrecio" class="form-text text-muted d-block mt-1"></small>
    </div>

    <!-- Comentario opcional -->
    <div class="mb-3">
        <label for="comentario" class="form-label">Comentarios adicionales (Opcional)</label>
        <textarea id="comentario" class="form-control" rows="2"></textarea>
    </div>

    <!-- Mensaje de error o éxito -->
    <div id="mensajeReserva" class="mb-3"></div>

    <button type="submit" class="boton boton-principal w-100">Confirmar reserva</button>
</form>
        <div id="mensajeReserva" class="mensaje-reserva"></div>
        <div id="mensajeReserva" class="mensaje-reserva"></div>
    </section>
</main>
<!-- fin main -->

</footer>

    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">

</body>
</html>
