<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reserva una experiencia en ExperienciaYa.">
    <title>ExperienciaYa - Reservar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="barra-superior text-center py-1 bg-dark text-white small">
        Compra online y vive experiencias increíbles
    </div>

    <header class="header-global">
        <nav class="navbar-global">
            <a href="index.html" class="logo-global">ExperienciaYa</a>

            <div class="menu-global">
                <a href="index.html">Inicio</a>
                <a href="experiencias.html">Experiencias</a>
                <a href="blog.html">Blog</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="contacto.html">Contacto</a>
            </div>

            <div class="iconos-global">
                <a href="usuario.html" title="Mi Perfil"><i class="bi bi-person-circle"></i></a>
                <a href="registro.html" title="Registrarse"><i class="bi bi-person-add"></i></a>
                <a href="carrito.html" title="Carrito"><i class="bi bi-bag"></i></a>
                <button id="cerrarSesion" class="btn btn-danger btn-sm">Cerrar Sesión</button>
            </div>
        </nav>
    </header>

    <main class="contenido-principal container my-5">
        <section class="seccion seccion-formulario mx-auto" style="max-width: 600px;">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h2 class="titulo-seccion text-center fw-bold mb-4" style="color: #4a6fa5;">Reservar experiencia</h2>
                
                <form id="formularioReserva">
                    <!-- Selector de Experiencia -->
                    <div class="mb-3">
                        <label for="experiencia" class="form-label font-weight-bold">Experiencia</label>
                        <select id="experiencia" class="form-select rounded-3" required>
                            <!-- Dinámico -->
                        </select>
                    </div>

                    <!-- Selector PREDISPUESTO de Fecha -->
                    <div class="mb-3">
                        <label for="fecha" class="form-label">Fecha disponible</label>
                        <select id="fecha" class="form-select rounded-3" required>
                            <option value="">-- Selecciona una fecha --</option>
                        </select>
                    </div>

                    <!-- Selector PREDISPUESTO de Hora -->
                    <div class="mb-3">
                        <label for="hora" class="form-label">Hora disponible</label>
                        <select id="hora" class="form-select rounded-3" required>
                            <option value="">-- Selecciona una hora --</option>
                        </select>
                    </div>

                    <!-- Cantidad de Personas -->
                    <div class="mb-3">
                        <label for="personas" class="form-label">Cantidad de personas</label>
                        <input type="number" id="personas" class="form-control rounded-3" min="1" value="1" required>
                        <div id="infoPrecio" class="form-text mt-2"></div>
                    </div>

                    <!-- Comentario opcional -->
                    <div class="mb-3">
                        <label for="comentario" class="form-label">Comentarios adicionales (Opcional)</label>
                        <textarea id="comentario" class="form-control rounded-3" rows="3" placeholder="Alergias, requerimientos especiales, etc."></textarea>
                    </div>

                    <div id="mensajeReserva" class="mb-3"></div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold" style="background-color: #8da9f2; border: none;">
                        Confirmar reserva
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer-principal text-center py-4 border-top mt-5">
        <h2>ExperienciaYa</h2>
        <p>Encuentra, reserva y disfruta.</p>
        <div class="footer-enlaces d-flex justify-content-center gap-3 mb-2">
            <a href="index.html">Inicio</a>
            <a href="experiencias.html">Experiencias</a>
            <a href="reserva.html">Reservar</a>
            <a href="contacto.html">Contacto</a>
        </div>
        <p class="text-muted small">© 2026 ExperienciaYa. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/reserva.js"></script>
</body>
</html>
