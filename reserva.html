<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Reserva una experiencia en ExperienciaYa.">

  <title>ExperienciaYa - Reservar</title>

  <link rel="stylesheet" href="css/style.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

    <header class="header-principal"> 
        <div class="botones-usuario" style="float:right;">
            <a href="usuario.html" class="boton boton-principal">Usuario</a>
            <a href="registro.html" class="boton boton-secundario">Registrarme</a>
        </div>
        
        <h1 style="float:inline-start;" class="titulo-principal">ExperienciaYa</h1> <br> <br>
        <p style="float: inline-start;" class="subtitulo-principal">Encuentra algo increíble para hacer</p>
    </header>

  <nav class="navbar navbar-expand-lg navbar-principal">

    <div class="container-fluid nav-contenedor">

      <a class="navbar-brand titulo-navbar" href="index.html">ExperienciaYa</a>

      <button class="navbar-toggler boton-menu" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Abrir menú">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="menuNavegacion">

        <div class="navbar-nav ms-auto">

          <a class="nav-link" href="registro.html">Registro</a>

          <a class="nav-link" href="usuario.html">Experiencias</a>

          <a class="nav-link" href="contacto.html">Contacto</a>

          <a class="nav-link" href="carrito.html">Carrito</a>

        </div>

      </div>

    </div>

  </nav>

  <main class="contenido-principal">

    <section class="seccion seccion-formulario">

      <h2 class="titulo-seccion">Reservar experiencia</h2>

      <form id="formularioReserva" class="formulario">

        <div class="grupo-formulario">

          <label for="experiencia">Experiencia</label>

          <select id="experiencia" name="experiencia" required>

            <option value="">Selecciona una experiencia</option>

            <option value="Kayak en Santiago"> Kayak en Santiago</option>

            <option value="Taller de ceramica">Taller de cerámica</option>

            <option value="Clase de cocina">Clases de cocina</option>

            <option value="Experiencia de trekking"> Experiencia de trekking</option>

          </select>

        </div>

        <div class="grupo-formulario">

          <label for="fecha">Fecha</label>

          <input type="date" id="fecha" name="fecha" required>

        </div>

        <div class="grupo-formulario">

          <label for="hora">Hora</label>

          <input type="time" id="hora" name="hora" required>

        </div>

        <div class="grupo-formulario">

          <label for="personas">Cantidad de personas</label>

          <input type="number" id="personas" name="personas" min="1" max="10" placeholder="Ej: 2" required>

        </div>

        <div class="grupo-formulario">

          <label for="comentario">Comentario adicional</label>

          <textarea id="comentario" name="comentario" placeholder="Escribe algún detalle adicional"></textarea>

        </div>

        <button class="boton boton-principal" type="submit">Confirmar reserva</button>

      </form>

      <div id="mensajeReserva" class="mensaje-reserva"></div>

    </section>

  </main>

  <footer class="footer-principal">

    <h2>ExperienciaYa</h2>

    <p>Encuentra, reserva y disfruta. </p>

    <div class="footer-enlaces">

      <a href="index.html">Inicio</a>

      <a href="registro.html">Registro</a>

      <a href="usuario.html">Experiencias</a>

      <a href="reserva.html">Reservar</a>

      <a href="contacto.html">Contacto</a>

    </div>

    <p>© 2026 ExperienciaYa. Todos los derechos reservados.</p>

  </footer>

  <script src="javascript.js"></script>

</body>

</html>
