<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExperienciaYa - Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="barra-superior text-center py-1 bg-dark text-white small">
        Compra online y vive experiencias increíbles
    </div>

    <header class="header-global">
        <nav class="navbar-global d-flex justify-content-between align-items-center px-4 py-3 border-bottom">
            <a href="index.html" class="logo-global fw-bold text-decoration-none fs-4 text-primary">ExperienciaYa</a>

            <div class="menu-global d-flex gap-3">
                <a href="index.html" class="text-dark text-decoration-none">Inicio</a>
                <a href="experiencias.html" class="text-dark text-decoration-none">Experiencias</a>
                <a href="blog.html" class="text-primary fw-bold text-decoration-none">Blog</a>
                <a href="reserva.html" class="text-dark text-decoration-none">Reservar</a>
                <a href="contacto.html" class="text-dark text-decoration-none">Contacto</a>
            </div>

            <div class="iconos-global d-flex gap-2">
                <a href="carrito.html" class="btn btn-outline-primary btn-sm"><i class="bi bi-bag"></i> Carrito</a>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold" style="color: #4a6fa5;">Nuestro Blog de Experiencias</h1>
            <p class="text-muted">Consejos, guías y novedades para inspirar tu próxima aventura.</p>
        </div>

        <!-- TARJETAS DE BLOGS CARGADAS DINÁMICAMENTE -->
        <div class="row g-4" id="contenedorBlogsPublico">
            <!-- Renderizado JS -->
        </div>
        <!-- MODAL DETALLE DE BLOG -->
        <div class="modal fade" id="modalVerBlog" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content border-0 rounded-4 shadow">
                    
                    <div class="modal-header border-0 pb-0">
                        <div>
                            <span id="modalBlogCategoria" class="badge bg-primary-subtle text-primary fw-semibold fs-6"></span>
                            <small class="text-muted ms-2" id="modalBlogFecha"></small>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body p-4">
                        <h2 class="fw-bold mb-3" id="modalBlogTitulo" style="color: #4a6fa5;"></h2>
                        
                        <div class="d-flex align-items-center mb-4 text-muted small">
                            <i class="bi bi-person-circle me-2 fs-5"></i>
                            <span>Escrito por <strong id="modalBlogAutor" class="text-dark"></strong></span>
                        </div>

                        <img id="modalBlogImagen" src="" alt="Imagen de Blog" class="img-fluid rounded-4 w-100 mb-4" style="max-height: 350px; object-fit: cover;">
                        
                        <p class="lead fw-semibold text-secondary mb-3" id="modalBlogResumen"></p>
                        <hr class="my-4">
                        
                        <div id="modalBlogContenido" class="lh-lg text-dark" style="white-space: pre-line;"></div>
                    </div>

                    <div class="modal-footer border-0">
                        <button type="button" class="btn text-white rounded-3 px-4" style="background-color: #8da9f2;" data-bs-dismiss="modal">Cerrar</button>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <footer class="footer-principal text-center py-4 border-top mt-5">
        <h2 class="fs-4 fw-bold">ExperienciaYa</h2>
        <p class="text-muted small">© 2026 ExperienciaYa. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
