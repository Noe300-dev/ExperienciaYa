<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Mantenedor de Blogs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navegación Admin -->
    <header class="bg-dark text-white py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 m-0">Panel de Administración</h1>
            <nav class="d-flex gap-3">
                <a href="mantenedor-productos.html" class="text-white-50 text-decoration-none">Experiencias</a>
                <a href="mantenedor-blog.html" class="text-white fw-bold text-decoration-none border-bottom border-2 border-primary pb-1">Blog</a>
                <a href="index.html" class="btn btn-outline-light btn-sm ms-3">Ver Sitio Web</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Gestión de Artículos del Blog</h2>
                <p class="text-muted m-0">Crea, edita y administra las publicaciones visibles en la web.</p>
            </div>
            <button class="btn btn-primary px-4 rounded-3 fw-bold" onclick="abrirModalNuevoBlog()">
                <i class="bi bi-plus-lg me-2"></i>Nuevo Artículo
            </button>
        </div>

        <!-- Tabla de Blogs -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle m-0">
                        <thead class="table-light">
                            <tr>
                                <th>Imagen</th>
                                <th>Título</th>
                                <th>Categoría</th>
                                <th>Autor</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBlogsBody">
                            <!-- Carga Dinámica JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Formulario Blog -->
    <div class="modal fade" id="modalBlog" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalBlogLabel">Nuevo Artículo de Blog</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formBlog" novalidate>
                    <div class="modal-body">
                        <input type="hidden" id="blogEsEdicion" value="false">
                        <input type="hidden" id="blogIdOriginal" value="">

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="blogTitulo" class="form-label">Título del Artículo *</label>
                                <input type="text" class="form-control" id="blogTitulo" required autocomplete="off">
                            </div>

                            <div class="col-md-4">
                                <label for="blogCategoria" class="form-label">Categoría *</label>
                                <select class="form-select" id="blogCategoria" required>
                                    <option value="Guías y Consejos">Guías y Consejos</option>
                                    <option value="Aventura">Aventura</option>
                                    <option value="Gastronomía">Gastronomía</option>
                                    <option value="Relax">Relax</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label for="blogAutor" class="form-label">Autor *</label>
                                <input type="text" class="form-control" id="blogAutor" required autocomplete="off">
                            </div>

                            <div class="col-md-4">
                                <label for="blogFecha" class="form-label">Fecha de Publicación *</label>
                                <input type="date" class="form-control" id="blogFecha" required>
                            </div>

                            <div class="col-md-4">
                                <label for="blogEstado" class="form-label">Estado *</label>
                                <select class="form-select" id="blogEstado" required>
                                    <option value="Publicado">Publicado</option>
                                    <option value="Borrador">Borrador</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label for="blogImagen" class="form-label">Seleccionar Imagen *</label>
                                <div class="d-flex gap-3 align-items-center">
                                    <select class="form-select" id="blogImagen" onchange="actualizarPreviewImagenBlog(this.value)">
                                        <option value="img/trekking.jpg">trekking.jpg</option>
                                        <option value="img/kayak.jpg">kayak.jpg</option>
                                        <option value="img/cocina.jpg">cocina.jpg</option>
                                        <option value="img/fondo1.jpg">fondo1.jpg</option>
                                        <option value="img/fondo2.jpg">fondo2.jpg</option>
                                    </select>
                                    <img id="blogImgPreview" src="img/trekking.jpg" alt="Preview" style="width: 70px; height: 50px; object-fit: cover; border-radius: 6px;">
                                </div>
                            </div>

                            <div class="col-md-12">
                                <label for="blogResumen" class="form-label">Resumen / Extracto *</label>
                                <textarea class="form-control" id="blogResumen" rows="2" required placeholder="Breve introducción para la vista previa en la lista..."></textarea>
                            </div>

                            <div class="col-md-12">
                                <label for="blogContenido" class="form-label">Contenido Completo del Artículo *</label>
                                <textarea class="form-control" id="blogContenido" rows="5" required placeholder="Escribe aquí el texto detallado del blog..."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary fw-bold" id="btnGuardarBlog">Guardar Artículo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/mantenedor-blog.js"></script>
</body>
</html>
