<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="css/style.css">
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"  rel="stylesheet" >
    <link  rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" >
</head>
<body class="fondo-index-personalizado">
<!-- BARRA SUPERIOR -->
<div class="barra-superior">
    Compra online y vive experiencias increíbles
</div>
<!-- NAVEGACIÓN -->
<header class="header-global">
    <nav class="navbar-global">
        <a href="index.html" class="logo-global">  ExperienciaYa </a>
        <div class="menu-global">
            <a href="index.html">Inicio</a>
            <a href="experiencias.html">Experiencias</a>
            <a href="reserva.html">Reservar</a>
            <a href="blog.html">Blog</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </div>
        <div class="iconos-global">
            <a href="usuario.html" title="Mi Perfil"> <i class="bi bi-person-circle"></i> <a href="registro.html" title="Registrarse"> <i class="bi bi-person-add"></i></a>
            <a href="carrito.html" title="Carrito">  <i class="bi bi-bag"></i> </a>
            <button id="cerrarSesion" class="btn btn-danger">  Cerrar Sesión </button>
        </div>
    </nav>
</header>
<!-- CONTENIDO PRINCIPAL -->
<main class="contenido-inicio">
    <section   class="seccion-inicio-grande contenedor-transparente"  style="max-width: 1100px; width: 95%; margin: 50px auto;"  >
        <h2 class="text-center mb-5"> Experiencias disponibles </h2>
        <!-- CARRUSEL -->
        <div  id="carouselExperiencias"  class="carousel slide" data-bs-ride="carousel" >
            <!-- INDICADORES -->
            <div   class="carousel-indicators" id="carouselIndicators" ></div>
            <!-- EXPERIENCIAS GENERADAS POR JAVASCRIPT -->
            <div   class="carousel-inner" id="carouselInner"  style="padding: 20px 50px 70px 50px;" ></div>
            <!-- BOTÓN ANTERIOR -->
            <button  class="carousel-control-prev custom-control-prev"  type="button"  data-bs-target="#carouselExperiencias" data-bs-slide="prev" >
                <span  class="carousel-control-prev-icon" aria-hidden="true"  ></span>
                <span class="visually-hidden"> Anterior  </span>
            </button>
            <!-- BOTÓN SIGUIENTE -->
            <button  class="carousel-control-next custom-control-next"   type="button" data-bs-target="#carouselExperiencias"  data-bs-slide="next"  >
                <span  class="carousel-control-next-icon"  aria-hidden="true"></span>
                <span class="visually-hidden"> Siguiente</span>
            </button>
        </div>
    </section>
</main>
